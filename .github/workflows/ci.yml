name: Flutter validation

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: false
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate localization
        run: flutter gen-l10n
      - name: Generate immutable models and dependency injection
        run: dart run build_runner build
      - name: Normalize generated Dart formatting
        run: dart format lib/app/theme/appearance.freezed.dart lib/app/theme/appearance.g.dart lib/app/bootstrap/dependencies.config.dart lib/app/localization/generated
      - name: Verify committed generated files
        run: git diff --exit-code -- lib
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
